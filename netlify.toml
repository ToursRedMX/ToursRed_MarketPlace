[build]
command = "SENTRY_RELEASE=${COMMIT_REF:-local} VITE_SENTRY_RELEASE=${COMMIT_REF:-local} npx vite build"
publish = "dist"
# Netlify construye en CADA push. Los PR que solo tocan supabase/ o
# .github/ no cambian el sitio, asi que no hace falta gastar un build.
# Exit 0 = saltar el build; distinto de 0 = construir.
# Sin referencias validas, o al reconstruir el mismo commit, continuar el build.
# Incluir Edge Functions, archivos publicos y configuracion que afecta al bundle.
ignore = 'test -n "$CACHED_COMMIT_REF" && test -n "$COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src/ public/ netlify/ index.html package.json package-lock.json netlify.toml vite.config.ts tailwind.config.js postcss.config.js tsconfig.json tsconfig.app.json tsconfig.node.json'

[build.environment]
SECRETS_SCAN_ENABLED = "true"
# Las VITE_* acaban en el bundle del navegador por diseno: que aparezcan en el
# output es su funcion, no una fuga. Verificado uso por uso en src/ (28-ago).
SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_APP_URL,VITE_SENTRY_DSN,VITE_GA_MEASUREMENT_ID"
NODE_VERSION = "24"

# Cabeceras de seguridad (hallazgo SEG-11 del pre-UAT, 29-oct-2026): staging solo mandaba Strict-Transport-Security.
# Estas cuatro se aplican de una vez porque el sitio no usa camara, microfono ni geolocalizacion y nadie debe poder
# enmarcarlo (verificado en src/: ni getUserMedia ni navigator.geolocation, y los iframes que hay embeben a otros, no al reves).
# La CSP va en Report-Only: el sitio carga Turnstile, GA, el SDK de MercadoPago, fuentes y fotos de agencias de varios hosts y un
# CSP estricto sin observar primero puede romper el pago o el login. Mirar la consola con esta cabecera, ajustar la lista y
# despues cambiar a Content-Security-Policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://huzsedewwzjywcpbkjkm.supabase.co wss://huzsedewwzjywcpbkjkm.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://api.mercadopago.com; frame-src https://challenges.cloudflare.com https://www.mercadopago.com.mx https://www.mercadopago.com; object-src 'none'; base-uri 'self'; form-action 'self'"

[[edge_functions]]
function = "sentry-tunnel"
path = "/sentry-tunnel"

[[edge_functions]]
function = "tour-slug-redirect"
path = "/tours/*"

[[edge_functions]]
function = "sitemap"
path = "/sitemap.xml"
