[build]
command = "npx vite build"
publish = "dist"

[build.environment]
SECRETS_SCAN_ENABLED = "false"
NODE_VERSION = "20"

[[edge_functions]]
function = "sentry-tunnel"
path = "/sentry-tunnel"

[[edge_functions]]
function = "tour-slug-redirect"
path = "/tours/*"

[[edge_functions]]
function = "sitemap"
path = "/sitemap.xml"