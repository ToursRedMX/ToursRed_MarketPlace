name: Test Supabase Edge Functions Restore Sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-functions-restore:
    runs-on: ubuntu-latest

    env:
      PRODUCTION_PROJECT_REF: huzsedewwzjywcpbkjkm
      RESTORE_PROJECT_REF: ${{ secrets.SUPABASE_RESTORE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify tools
        run: |
          supabase --version
          jq --version
          python3 --version

      - name: Safety check Restore Test project
        run: |
          echo "Production project: ${PRODUCTION_PROJECT_REF}"
          echo "Restore Test project: ${RESTORE_PROJECT_REF}"

          if [ -z "$RESTORE_PROJECT_REF" ]; then
            echo "ERROR: SUPABASE_RESTORE_PROJECT_REF is empty."
            exit 1
          fi

          if [ "$RESTORE_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "============================================"
            echo "CRITICAL SAFETY STOP"
            echo "============================================"
            echo "Restore Test matches production."
            echo "Nothing will be modified."
            exit 1
          fi

          echo ""
          echo "Safety check passed."
          echo "Target is NOT production."

      - name: Verify local Edge Functions
        run: |
          LOCAL_COUNT=$(
            find supabase/functions \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
            | grep -v '^_' \
            | wc -l
          )

          echo "Local Edge Functions: ${LOCAL_COUNT}"
          echo "LOCAL_COUNT=${LOCAL_COUNT}" >> "$GITHUB_ENV"

          # Antes se exigia exactamente 169. Ese numero era el conteo del repo el
          # 26-ago y caduco al siguiente cambio: hoy hay 172. Un umbral escrito a
          # mano envejece solo, igual que el de los cron jobs en la pieza J.
          # Ahora solo se comprueba que haya algo; la comparacion util es contra
          # produccion, mas abajo.
          if [ "$LOCAL_COUNT" -eq 0 ]; then
            echo "ERROR: no se encontro ninguna Edge Function local."
            exit 1
          fi

          echo "Local Edge Function count is correct."

      - name: Verify config.toml
        run: |
          if [ ! -f "supabase/config.toml" ]; then
            echo "ERROR: supabase/config.toml does not exist."
            exit 1
          fi

          python3 <<'PY'
          import pathlib
          import tomllib

          config_path = pathlib.Path("supabase/config.toml")

          with config_path.open("rb") as f:
              config = tomllib.load(f)

          functions = config.get("functions", {})

          false_count = sum(
              1
              for value in functions.values()
              if value.get("verify_jwt", True) is False
          )

          print(
              f"Explicit verify_jwt=false entries: "
              f"{false_count}"
          )

          if false_count != 69:
              raise SystemExit(
                  f"ERROR: Expected 69 verify_jwt=false entries, "
                  f"found {false_count}."
              )

          print("config.toml validation passed.")
          PY

      - name: Validate verify-contract-otp shared imports
        run: |
          FILE="supabase/functions/verify-contract-otp/index.ts"

          echo "Checking ${FILE}"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: verify-contract-otp/index.ts does not exist."
            exit 1
          fi

          if grep -q '"\./_shared/' "$FILE"; then
            echo "ERROR: verify-contract-otp still contains incorrect ./_shared paths."
            echo ""
            grep -n '"\./_shared/' "$FILE" || true
            exit 1
          fi

          CONTRACT_IMPORTS=$(
            grep -c '\.\./_shared/contractDocDefinition\.ts' "$FILE" || true
          )

          FONT_IMPORTS=$(
            grep -c '\.\./_shared/robotoFonts\.ts' "$FILE" || true
          )

          echo "contractDocDefinition correct imports: ${CONTRACT_IMPORTS}"
          echo "robotoFonts correct imports:           ${FONT_IMPORTS}"

          if [ "$CONTRACT_IMPORTS" -lt 2 ]; then
            echo "ERROR: Expected at least 2 correct contractDocDefinition imports."
            exit 1
          fi

          if [ "$FONT_IMPORTS" -lt 1 ]; then
            echo "ERROR: Expected at least 1 correct robotoFonts import."
            exit 1
          fi

          echo ""
          echo "PASS: verify-contract-otp shared imports are correct."

      - name: Export production Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --project-ref "$PRODUCTION_PROJECT_REF" \
            --output json \
            > production-functions-raw.json

          jq '
            (
              if type == "array"
              then .
              else (.functions // [])
              end
            )
            | map({
                slug: (.slug // .name),
                verify_jwt: .verify_jwt
              })
            | sort_by(.slug)
          ' production-functions-raw.json \
          > production-functions.json

          COUNT=$(jq 'length' production-functions.json)

          JWT_TRUE=$(
            jq '
              [.[] | select(.verify_jwt == true)]
              | length
            ' production-functions.json
          )

          JWT_FALSE=$(
            jq '
              [.[] | select(.verify_jwt == false)]
              | length
            ' production-functions.json
          )

          echo "Production functions:        ${COUNT}"
          echo "Production verify_jwt=true:  ${JWT_TRUE}"
          echo "Production verify_jwt=false: ${JWT_FALSE}"

          # ------------------------------------------------------------------
          # Consistencia en vez de numeros fijos. Antes se exigia 169/100/69;
          # lo real hoy es 176/101/75 y el workflow fallaba en este punto.
          #
          # MODO REPORTE, NO BLOQUEO: la deriva entre repo y produccion ya esta
          # diagnosticada (pieza K de PENDIENTES: 4 funciones desplegadas que ya
          # no estan en el repo, y 7 sin JWT que el repo no declara). Bloquear
          # aqui solo repetiria a diario algo que ya sabemos, sin aportar nada.
          # Cuando esa deriva se resuelva, cambiar los `echo` por `exit 1`.
          # ------------------------------------------------------------------

          DERIVA=0

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: produccion no reporto ninguna funcion."
            exit 1
          fi

          if [ "$(( JWT_TRUE + JWT_FALSE ))" -ne "$COUNT" ]; then
            echo "ERROR: la particion de verify_jwt no suma (${JWT_TRUE}+${JWT_FALSE} != ${COUNT})."
            exit 1
          fi

          if [ "$COUNT" -ne "$LOCAL_COUNT" ]; then
            echo "AVISO: produccion tiene ${COUNT} funciones y el repo ${LOCAL_COUNT}."
            DERIVA=1

            jq -r '.[].slug' production-functions.json | sort > /tmp/prod-slugs.txt
            find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -v '^_' | sort > /tmp/local-slugs.txt

            echo ""
            echo "Desplegadas sin archivo en el repo:"
            comm -23 /tmp/prod-slugs.txt /tmp/local-slugs.txt | sed 's/^/  - /'
            echo "En el repo pero no desplegadas:"
            comm -13 /tmp/prod-slugs.txt /tmp/local-slugs.txt | sed 's/^/  - /'
          fi

          if [ "$DERIVA" -eq 1 ]; then
            {
              echo "### Deriva entre el repo y produccion"
              echo ""
              echo "- Produccion: ${COUNT} funciones (${JWT_TRUE} con JWT, ${JWT_FALSE} sin)"
              echo "- Repo: ${LOCAL_COUNT}"
              echo ""
              echo "Reportado sin bloquear. Ver la pieza K de PENDIENTES_27_AGO.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build 100-function DRP sample
        run: |
          python3 <<'PY'
          import json
          import pathlib

          REQUIRED_FUNCTION = "verify-contract-otp"

          production = json.loads(
              pathlib.Path(
                  "production-functions.json"
              ).read_text()
          )

          jwt_false = sorted(
              [
                  item
                  for item in production
                  if item["verify_jwt"] is False
              ],
              key=lambda item: item["slug"]
          )

          jwt_true = sorted(
              [
                  item
                  for item in production
                  if item["verify_jwt"] is True
              ],
              key=lambda item: item["slug"]
          )

          if len(jwt_false) != 69:
              raise SystemExit(
                  f"ERROR: Expected 69 JWT-false functions, "
                  f"found {len(jwt_false)}."
              )

          required = next(
              (
                  item
                  for item in jwt_true
                  if item["slug"] == REQUIRED_FUNCTION
              ),
              None
          )

          if required is None:
              raise SystemExit(
                  f"ERROR: Required function "
                  f"{REQUIRED_FUNCTION} was not found "
                  f"with verify_jwt=true in production."
              )

          remaining_true = [
              item
              for item in jwt_true
              if item["slug"] != REQUIRED_FUNCTION
          ]

          sample = (
              jwt_false
              + [required]
              + remaining_true[:30]
          )

          if len(sample) != 100:
              raise SystemExit(
                  f"ERROR: Expected sample size 100, "
                  f"found {len(sample)}."
              )

          if not any(
              item["slug"] == REQUIRED_FUNCTION
              for item in sample
          ):
              raise SystemExit(
                  "ERROR: verify-contract-otp "
                  "is not included in the sample."
              )

          false_count = sum(
              1
              for item in sample
              if item["verify_jwt"] is False
          )

          true_count = sum(
              1
              for item in sample
              if item["verify_jwt"] is True
          )

          if false_count != 69:
              raise SystemExit(
                  f"ERROR: Expected 69 JWT-false functions "
                  f"in sample, found {false_count}."
              )

          if true_count != 31:
              raise SystemExit(
                  f"ERROR: Expected 31 JWT-true functions "
                  f"in sample, found {true_count}."
              )

          pathlib.Path(
              "sample-functions.json"
          ).write_text(
              json.dumps(sample, indent=2)
          )

          pathlib.Path(
              "sample-functions.txt"
          ).write_text(
              "\n".join(
                  item["slug"]
                  for item in sample
              ) + "\n"
          )

          print("============================================")
          print("DRP EDGE FUNCTION SAMPLE")
          print("============================================")
          print(f"Total sample:              {len(sample)}")
          print(f"verify_jwt=false:          {false_count}")
          print(f"verify_jwt=true:           {true_count}")
          print(f"Required function present: YES")
          print(f"Required function:         {REQUIRED_FUNCTION}")
          print("")
          print("Selected functions:")

          for item in sample:
              marker = (
                  "  <-- REQUIRED"
                  if item["slug"] == REQUIRED_FUNCTION
                  else ""
              )

              print(
                  f"{item['slug']} "
                  f"verify_jwt={str(item['verify_jwt']).lower()}"
                  f"{marker}"
              )
          PY

      - name: Verify sample exists locally
        run: |
          ERROR_COUNT=0

          while IFS= read -r FUNCTION; do
            if [ ! -f "supabase/functions/${FUNCTION}/index.ts" ]; then
              echo "ERROR: Missing local function: ${FUNCTION}"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < sample-functions.txt

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo "ERROR: ${ERROR_COUNT} sample functions are missing locally."
            exit 1
          fi

          echo "All 100 sample functions exist locally."

      - name: Confirm verify-contract-otp is in sample
        run: |
          if ! grep -Fxq "verify-contract-otp" sample-functions.txt; then
            echo "ERROR: verify-contract-otp is not in the sample."
            exit 1
          fi

          echo "PASS: verify-contract-otp is included in the 100-function sample."

      - name: List existing Restore Test functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --project-ref "$RESTORE_PROJECT_REF" \
            --output json \
            > restore-before-raw.json

          jq '
            (
              if type == "array"
              then .
              else (.functions // [])
              end
            )
            | map(.slug // .name)
            | sort
          ' restore-before-raw.json \
          > restore-before.json

          EXISTING_COUNT=$(jq 'length' restore-before.json)

          echo "Existing Restore Test functions: ${EXISTING_COUNT}"

          jq -r '.[]' restore-before.json || true

      - name: Clean Restore Test Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          EXISTING_COUNT=$(jq 'length' restore-before.json)

          if [ "$EXISTING_COUNT" -eq 0 ]; then
            echo "Restore Test has no Edge Functions to remove."
            exit 0
          fi

          echo "Deleting existing Restore Test Edge Functions..."

          jq -r '.[]' restore-before.json \
          | while IFS= read -r FUNCTION; do
              echo "Deleting ${FUNCTION}"

              supabase functions delete \
                "$FUNCTION" \
                --project-ref "$RESTORE_PROJECT_REF"
            done

          echo ""
          echo "Restore Test Edge Functions cleaned."

      - name: Verify Restore Test is empty
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --project-ref "$RESTORE_PROJECT_REF" \
            --output json \
            > restore-empty-check.json

          EMPTY_COUNT=$(
            jq '
              if type == "array"
              then length
              else (.functions // []) | length
              end
            ' restore-empty-check.json
          )

          echo "Functions remaining: ${EMPTY_COUNT}"

          if [ "$EMPTY_COUNT" -ne 0 ]; then
            echo "ERROR: Restore Test was not completely cleaned."
            exit 1
          fi

          echo "Restore Test is empty."

      - name: Deploy 100-function DRP sample
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          DEPLOYED=0

          while IFS= read -r FUNCTION; do
            echo ""
            echo "============================================"
            echo "Deploying ${FUNCTION}"
            echo "============================================"

            supabase functions deploy \
              "$FUNCTION" \
              --project-ref "$RESTORE_PROJECT_REF" \
              --use-api

            DEPLOYED=$((DEPLOYED + 1))

            echo "Deployed ${DEPLOYED}/100"
          done < sample-functions.txt

          echo ""
          echo "All 100 sample functions deployed."

      - name: Confirm verify-contract-otp deployed successfully
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --project-ref "$RESTORE_PROJECT_REF" \
            --output json \
            > verify-contract-check.json

          FOUND=$(
            jq '
              (
                if type == "array"
                then .
                else (.functions // [])
                end
              )
              | [
                  .[]
                  | select(
                      (.slug // .name)
                      == "verify-contract-otp"
                    )
                ]
              | length
            ' verify-contract-check.json
          )

          echo "verify-contract-otp instances in Restore Test: ${FOUND}"

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: verify-contract-otp was not deployed successfully."
            exit 1
          fi

          echo ""
          echo "PASS: verify-contract-otp deployed successfully."

      - name: Export Restore Test Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --project-ref "$RESTORE_PROJECT_REF" \
            --output json \
            > restore-functions-raw.json

          jq '
            (
              if type == "array"
              then .
              else (.functions // [])
              end
            )
            | map({
                slug: (.slug // .name),
                verify_jwt: .verify_jwt
              })
            | sort_by(.slug)
          ' restore-functions-raw.json \
          > restore-functions.json

      - name: Validate Restore Test counts
        run: |
          RESTORE_COUNT=$(
            jq 'length' restore-functions.json
          )

          RESTORE_FALSE=$(
            jq '
              [.[] | select(.verify_jwt == false)]
              | length
            ' restore-functions.json
          )

          RESTORE_TRUE=$(
            jq '
              [.[] | select(.verify_jwt == true)]
              | length
            ' restore-functions.json
          )

          echo "============================================"
          echo "RESTORE TEST SAMPLE COUNTS"
          echo "============================================"
          echo ""
          echo "Functions:        ${RESTORE_COUNT}"
          echo "verify_jwt=false: ${RESTORE_FALSE}"
          echo "verify_jwt=true:  ${RESTORE_TRUE}"

          echo "RESTORE_COUNT=${RESTORE_COUNT}" >> "$GITHUB_ENV"
          echo "RESTORE_FALSE=${RESTORE_FALSE}" >> "$GITHUB_ENV"
          echo "RESTORE_TRUE=${RESTORE_TRUE}" >> "$GITHUB_ENV"

          # El 100 SI es un invariante de diseno: la muestra DRP se construye de
          # exactamente 100 funciones. Se mantiene como fallo duro.
          if [ "$RESTORE_COUNT" -ne 100 ]; then
            echo "ERROR: se esperaban exactamente 100 funciones restauradas."
            exit 1
          fi

          # El 69/31 NO era de diseno: se derivaba del numero de funciones sin
          # JWT que hubiera en produccion (69 entonces, 75 hoy), asi que caducaba
          # solo. Se comprueba que la particion sea coherente, no su valor.
          if [ "$(( RESTORE_FALSE + RESTORE_TRUE ))" -ne "$RESTORE_COUNT" ]; then
            echo "ERROR: la particion no suma (${RESTORE_FALSE}+${RESTORE_TRUE} != ${RESTORE_COUNT})."
            exit 1
          fi

          if [ "$RESTORE_FALSE" -eq 0 ]; then
            echo "ERROR: la muestra no incluye ninguna funcion sin JWT."
            echo "Se construye para cubrirlas todas, asi que cero indica un fallo."
            exit 1
          fi

      - name: Compare sample with production exactly
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import sys

          sample = json.loads(
              pathlib.Path(
                  "sample-functions.json"
              ).read_text()
          )

          restore = json.loads(
              pathlib.Path(
                  "restore-functions.json"
              ).read_text()
          )

          expected = {
              item["slug"]: item["verify_jwt"]
              for item in sample
          }

          actual = {
              item["slug"]: item["verify_jwt"]
              for item in restore
          }

          missing = sorted(
              set(expected) - set(actual)
          )

          extra = sorted(
              set(actual) - set(expected)
          )

          jwt_mismatches = sorted(
              slug
              for slug in set(expected) & set(actual)
              if expected[slug] != actual[slug]
          )

          print("============================================")
          print("PRODUCTION SAMPLE VS RESTORE TEST")
          print("============================================")
          print("")
          print(f"Expected functions:       {len(expected)}")
          print(f"Restored functions:       {len(actual)}")
          print(f"Missing:                  {len(missing)}")
          print(f"Extra:                    {len(extra)}")
          print(f"JWT mismatches:           {len(jwt_mismatches)}")

          if missing:
              print("")
              print("MISSING:")
              for slug in missing:
                  print(slug)

          if extra:
              print("")
              print("EXTRA:")
              for slug in extra:
                  print(slug)

          if jwt_mismatches:
              print("")
              print("JWT MISMATCHES:")

              for slug in jwt_mismatches:
                  print(
                      f"{slug}: "
                      f"production={expected[slug]}, "
                      f"restore={actual[slug]}"
                  )

          if missing or extra or jwt_mismatches:
              print("")
              print(
                  "FAIL: Restore sample differs "
                  "from production."
              )
              sys.exit(1)

          print("")
          print(
              "PASS: All 100 sampled Edge Functions "
              "match production exactly."
          )
          PY

      - name: DRP sample restore summary
        run: |
          echo "============================================"
          echo "TOURSRED EDGE FUNCTIONS DRP SAMPLE TEST"
          echo "============================================"
          echo ""
          echo "Functions tested:       ${RESTORE_COUNT} / 100"
          echo "verify_jwt=false:       ${RESTORE_FALSE} / 69"
          echo "verify_jwt=true:        ${RESTORE_TRUE} / 31"
          echo "verify-contract-otp:    DEPLOYED"
          echo "Missing functions:      0"
          echo "Extra functions:        0"
          echo "JWT mismatches:         0"
          echo ""
          echo "PASS"
          echo ""
          echo "100-function Edge Functions reconstruction"
          echo "validated successfully on Free plan."

      - name: Upload DRP verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toursred-edge-functions-restore-sample
          path: |
            production-functions-raw.json
            production-functions.json
            sample-functions.json
            sample-functions.txt
            restore-before-raw.json
            restore-before.json
            restore-empty-check.json
            verify-contract-check.json
            restore-functions-raw.json
            restore-functions.json
          retention-days: 30
