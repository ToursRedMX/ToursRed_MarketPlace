name: Test Supabase Hourly Data Restore

on:
  workflow_dispatch:

jobs:
  hourly-data-restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify PostgreSQL tools
        run: |
          /usr/lib/postgresql/17/bin/psql --version

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Safety check restore target
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          if [ -z "$RESTORE_DATABASE_URL" ]; then
            echo "ERROR: SUPABASE_RESTORE_TEST_DB_URL is not configured."
            exit 1
          fi

          if echo "$RESTORE_DATABASE_URL" | grep -q "huzsedewwzjywcpbkjkm"; then
            echo "ERROR: Restore target points to PRODUCTION."
            exit 1
          fi

          echo "Restore target safety check passed."

      - name: Find latest hourly data backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          LATEST_FOLDER=$(
            aws s3 ls \
              "s3://${B2_BUCKET}/hourly-data/" \
              --endpoint-url "$B2_ENDPOINT" \
              --region "$AWS_DEFAULT_REGION" \
            | awk '{print $2}' \
            | sed 's:/$::' \
            | sort \
            | tail -n 1
          )

          if [ -z "$LATEST_FOLDER" ]; then
            echo "ERROR: No hourly data backups found."
            exit 1
          fi

          echo "Latest hourly backup: $LATEST_FOLDER"
          echo "LATEST_FOLDER=$LATEST_FOLDER" >> "$GITHUB_ENV"

      - name: Download latest hourly backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          mkdir -p hourly-restore

          aws s3 cp \
            "s3://${B2_BUCKET}/hourly-data/${LATEST_FOLDER}/data.sql" \
            hourly-restore/data.sql \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

          aws s3 cp \
            "s3://${B2_BUCKET}/hourly-data/${LATEST_FOLDER}/data.sql.sha256" \
            hourly-restore/data.sql.sha256 \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

      - name: Verify downloaded files
        run: |
          test -s hourly-restore/data.sql
          test -s hourly-restore/data.sql.sha256

          echo "Downloaded files:"
          ls -lh hourly-restore/

      - name: Verify SHA256 checksum
        run: |
          cd hourly-restore
          sha256sum -c data.sql.sha256

      - name: Test Restore Test connection
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --variable ON_ERROR_STOP=1 \
            --command "SELECT current_database(), version();"

      - name: Verify required schemas exist
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          PUBLIC_EXISTS=$(
            /usr/lib/postgresql/17/bin/psql \
              "$RESTORE_DATABASE_URL" \
              --tuples-only \
              --no-align \
              --command "
                SELECT COUNT(*)
                FROM pg_namespace
                WHERE nspname = 'public';
              "
          )

          AUTH_EXISTS=$(
            /usr/lib/postgresql/17/bin/psql \
              "$RESTORE_DATABASE_URL" \
              --tuples-only \
              --no-align \
              --command "
                SELECT COUNT(*)
                FROM pg_namespace
                WHERE nspname = 'auth';
              "
          )

          STORAGE_EXISTS=$(
            /usr/lib/postgresql/17/bin/psql \
              "$RESTORE_DATABASE_URL" \
              --tuples-only \
              --no-align \
              --command "
                SELECT COUNT(*)
                FROM pg_namespace
                WHERE nspname = 'storage';
              "
          )

          if [ "$PUBLIC_EXISTS" -ne 1 ]; then
            echo "ERROR: public schema does not exist."
            exit 1
          fi

          if [ "$AUTH_EXISTS" -ne 1 ]; then
            echo "ERROR: auth schema does not exist."
            exit 1
          fi

          if [ "$STORAGE_EXISTS" -ne 1 ]; then
            echo "ERROR: storage schema does not exist."
            exit 1
          fi

          echo "Required schemas exist."

      - name: Clear existing application data
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          cat > /tmp/truncate_restore_data.sql <<'SQL'
          DO $$
          DECLARE
            r RECORD;
          BEGIN
            FOR r IN
              SELECT
                quote_ident(n.nspname) || '.' || quote_ident(c.relname) AS table_name
              FROM pg_class c
              JOIN pg_namespace n
                ON n.oid = c.relnamespace
              WHERE c.relkind = 'r'
                AND n.nspname IN ('public', 'auth', 'storage')
                AND NOT (
                  n.nspname = 'storage'
                  AND c.relname IN (
                    'buckets_vectors',
                    'vector_indexes'
                  )
                )
              ORDER BY n.nspname, c.relname
            LOOP
              BEGIN
                EXECUTE 'TRUNCATE TABLE ' || r.table_name || ' CASCADE';
              EXCEPTION
                WHEN insufficient_privilege THEN
                  RAISE NOTICE 'Skipping table without TRUNCATE privilege: %', r.table_name;
              END;
            END LOOP;
          END
          $$;
          SQL

          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --variable ON_ERROR_STOP=1 \
            --file /tmp/truncate_restore_data.sql

      - name: Restore hourly database data
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --command "SET session_replication_role = replica" \
            --file hourly-restore/data.sql

      - name: Validate public table count
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --command "
              SELECT COUNT(*) AS public_tables
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type = 'BASE TABLE';
            "

      - name: Validate Auth users
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --command "
              SELECT COUNT(*) AS auth_users
              FROM auth.users;
            "

      - name: Validate Storage metadata
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --command "
              SELECT
                (SELECT COUNT(*) FROM storage.buckets) AS storage_buckets,
                (SELECT COUNT(*) FROM storage.objects) AS storage_objects;
            "

      - name: Generate Restore Test inventory
        env:
          RESTORE_DATABASE_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$RESTORE_DATABASE_URL" \
            --no-align \
            --field-separator='|' \
            --tuples-only \
            --command "
              SELECT
                schemaname,
                relname,
                n_live_tup
              FROM pg_stat_user_tables
              WHERE schemaname IN ('public', 'auth', 'storage')
              ORDER BY schemaname, relname;
            " \
            > hourly-restore/restore_inventory.txt

          echo "Restore inventory:"
          cat hourly-restore/restore_inventory.txt

      - name: DRP hourly restore summary
        run: |
          echo "============================================"
          echo "TOURSRED HOURLY DATA RESTORE TEST"
          echo "============================================"
          echo ""
          echo "Latest hourly backup       ${LATEST_FOLDER}"
          echo "SHA256                     VERIFIED"
          echo "Restore target             RESTORE TEST"
          echo "Existing data              CLEARED"
          echo "Hourly data                RESTORED"
          echo ""
          echo "PASS"

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf hourly-restore
          rm -f /tmp/truncate_restore_data.sql
