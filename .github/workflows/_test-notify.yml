name: PRUEBA TEMPORAL del notificador

# Este archivo se borra antes de mergear. Solo existe para comprobar que
# notify-backup-failure.yml crea la incidencia de verdad.

on:
  pull_request:
    paths:
      - '.github/workflows/_test-notify.yml'

jobs:
  fallar-a-proposito:
    runs-on: ubuntu-latest
    steps:
      - name: Fallar
        run: |
          echo "Fallo deliberado para probar el notificador."
          exit 1

  avisar-si-falla:
    needs: [fallar-a-proposito]
    if: failure()
    uses: ./.github/workflows/notify-backup-failure.yml
    permissions:
      issues: write
      contents: read
    with:
      workflow_name: 'PRUEBA TEMPORAL - borrar esta incidencia'
