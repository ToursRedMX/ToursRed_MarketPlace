name: Lint

# Bloquea si el conteo SUBE respecto de la linea base. Hasta el 07-sep-2026 este
# workflow era informativo a proposito y salia verde siempre, incluso ante un PR
# que agregara 50 errores: la linea base existia pero no se exigia (F-4 de la
# auditoria de frontend). Eso ya escondio un hallazgo real —una funcion de cobro
# muerta que ESLint llevaba marcando desde siempre, invisible en un reporte de
# 2,485 lineas—.
#
# NO se exige cero: bloquear con ~2,400 errores heredados haria imposible
# mergear nada. Se tolera lo viejo y se corta lo nuevo, igual que tipos-edge.
#
# Hermano de typecheck.yml. Hasta el 31-ago-2026 ningun workflow ejecutaba
# ESLint, asi que `npm run lint` era decorativo: 2,472 errores que nadie veia.
#
# Se lee el reporte en JSON, no la salida `stylish`. Motivo concreto: las reglas
# del React Compiler (react-hooks/set-state-in-effect, /immutability, /refs,
# /static-components, /purity, /preserve-manual-memoization) NO imprimen el
# ruleId en stylish, asi que contar por "ultimo campo de la linea" atribuye 274
# problemas a palabras sueltas del mensaje ("renders", "declared", "render").
# El JSON si trae ruleId en todos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Linea base sobre main, medida el 31-ago-2026 con `npm run lint`
  # (eslint 10 / typescript-eslint 8.68.0). Actualizar al bajarla.
  # El desglose por regla vive en BASE dentro del script de resumen.
  #
  # Historial de bajadas (cada PR que baja la base la actualiza aqui):
  #   31-ago  2472/2561  medicion inicial
  #   31-ago  2471/2560  cierra el unico rules-of-hooks (BookingFlowStep3)
  #   31-ago  2458/2547  saca PermissionCheckbox de AdminUsers (-13 static-components)
  #   31-ago  2423/2512  #97 tipa vehicle_map_type (-4 any), #98 reloj de SLA
  #                      (-2 purity), #99 saca Th/SortIcon/SectionMessage
  #                      (-29 static-components). Medido sobre main en 4fa4c2d,
  #                      no proyectado.
  #   07-sep  2388/2476  #146: se retira codigo muerto (una funcion de cobro
  #                      sin usar en BookingForm, consultas de wallet/puntos
  #                      sin consumir en BookingFlowStep3, un estado sin leer
  #                      en AgencyFinancials) y se borra el handler muerto de
  #                      oxxo_payment.expired. Numero MEDIDO por CI en el job
  #                      101883996483 sobre 98fee3f, no proyectado ni tomado
  #                      de un entorno local.
  BASELINE_ERRORS: 2388
  BASELINE_WARNINGS: 88
  BASELINE_TOTAL: 2476
  BASELINE_FILES: 325

jobs:
  lint:
    runs-on: ubuntu-latest

    # Postgres para las pruebas de migraciones. Va colgado de `lint` y no en un
    # job aparte por lo mismo que los demas checks de este archivo: `lint` ya es
    # requerido y corre en todos los PR, asi que no se agrega un check nuevo que
    # pueda quedarse en "Waiting for status to be reported".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MFA helper and privileged handlers
        run: node scripts/test-mfa-aal2.mjs

      - name: Verify Sentry tunnel destination restrictions
        run: node scripts/test-sentry-tunnel.mjs

      - name: Verify PostgREST thenable regressions
        run: node scripts/test-postgrest-thenables.mjs

      - name: Verify CFDI PAC configuration failures
        run: node scripts/test-cfdi-pac-config.mjs

      - name: Verify shared CFDI and step-up authorization
        run: node scripts/test-shared-authorization.mjs

      - name: Verify OpenPay customer persistence
        run: node scripts/test-openpay-customer.mjs

      - name: Verify PayPal refund configuration
        run: node scripts/test-paypal-refund-config.mjs

      - name: Verify refund authorization
        run: node scripts/test-refund-authorization.mjs

      - name: Verify fiscal, accounting and inquiry security
        run: node scripts/test-edge-security-closures.mjs

      - name: Verify deadline cancellation and OpenPay metadata
        run: node scripts/test-deadline-openpay.mjs

      # Segunda mitad de C-1: que el webhook no confirme sin mirar cuanto entro.
      # Los casos son reservas reales del proyecto, no inventadas.
      - name: Verify payment coverage before confirming a booking
        run: node scripts/test-cobertura-pago.mjs

      # El chequeo de cuenta bloqueada (is_active) debe fallar cerrado en los
      # dos caminos: el login por contrasena y AuthContext.
      - name: Verify blocked-account check fails closed
        run: node scripts/test-auth-falla-cerrado.mjs

      # PayPal: que el dinero cobrado quede asentado aunque no alcance el piso
      # —si no, dos pagos parciales no se suman— y que solo cuente como anticipo
      # el dinero cuyo charge_context es booking_deposit.
      - name: Verify PayPal booking confirmation records every capture
        run: node scripts/test-paypal-confirmacion.mjs

      # La regla del exigible y del piso, que `9dd296b` rompio en 5 sitios al
      # tomar el maximo de un importe bruto y uno neto. Casos con reservas reales.
      - name: Verify the amount-due and deposit-floor rules
        run: node scripts/test-exigible.mjs

      # La tasa de comision que ve y guarda AdminAgencies sale de
      # platform_settings, no de un 10% clavado. El `||` de antes trataba el 0
      # como ausente, asi que un 0% pactado se convertia en 10% al reabrir la
      # ficha -- y si se guardaba cualquier otro campo, ese 10% se escribia.
      - name: Verify agency commission rates come from configuration
        run: node scripts/test-tasa-comision-agencia.mjs

      # El contrato entre la vista y la pantalla del reporte maestro. Si alguien
      # renombra una columna de la vista, el front la lee como undefined y pinta
      # CERO: sin error, sin pantalla roja, solo un numero mas chico. Es el peor
      # modo de fallo para un reporte financiero, y es el que motivo la
      # reescritura entera.
      - name: Verify the master report matches the view it reads
        run: node scripts/test-reporte-maestro-contrato.mjs

      # El MFA del panel debe pedir un challenge FRESCO en cada verificacion.
      # Un challenge se consume al usarse, y reutilizar uno guardado deja al
      # admin fuera con un 422 cuyo mensaje habla de IPs que nunca cambiaron.
      # Paso el 10-sep-2026: dos POST /verify seguidos sin un solo /challenge.
      - name: Verify admin MFA always mints a fresh challenge
        run: node scripts/test-mfa-challenge-fresco.mjs

      # El lector de CFDI de la captura de gastos propone importes que terminan
      # en un asiento y en IVA acreditable. Tres trampas: que se duplique el IVA
      # (en un CFDI `Traslado` aparece dos veces, por concepto y en el bloque
      # global), que se acredite el IVA de una factura que no esta a nombre de
      # la plataforma, y que subtotal + iva no de total cuando hay descuentos.
      - name: Verify the CFDI reader proposes amounts that add up and belong to us
        run: node scripts/test-cfdi-xml.mjs

      # Tres promesas de la captura de gastos que solo viven en la pantalla y
      # que ninguna prueba de SQL puede cubrir: que el total en pesos se calcule
      # pero se pueda EDITAR (el banco aplica su propio tipo de cambio), que el
      # XML proponga sin bloquear los campos, y que el selector de cuentas
      # ofrezca solo cuentas de gasto -- si ofreciera Bancos, el trigger de la
      # base rechazaria el guardado sin que nadie entienda por que.
      - name: Verify the expense screen keeps its editable-total and propose-only promises
        run: node scripts/test-pantalla-gastos.mjs

      # El panel no podia dar de alta contadores: `create-admin-user` tenia el
      # rol quemado y la lista filtraba solo admins. Y tres permisos contables
      # existian en la tabla sin casilla en la UI. El caso 4 es el que importa:
      # un permiso viaja por CUATRO sitios (select, mapeo, base del editor y
      # upsert) y agregarlo a medias es peor que no tocarlo -- si falta en el
      # select, el editor lo pinta apagado y guardar lo BORRA.
      - name: Verify accountants can be created and accounting permissions persist
        run: node scripts/test-alta-de-contadores.mjs

      # PayPal era el tercer hueco de la comision, despues de MercadoPago (#211)
      # y OpenPay (#213): `capture-paypal-order` solo insertaba filas nuevas y
      # al encontrar una existente se iba, asi que el 0 que dejaba el camino
      # sincrono se quedaba. Medido: 2 cobros, $6,162.44. Esta prueba EJECUTA la
      # logica con un cliente de mentira, que es lo unico que demuestra la regla
      # de no pisar una comision buena con un cero.
      - name: Verify a PayPal charge always ends up with its processor fee
        run: node scripts/test-cobros-paypal.mjs

      # El bloqueo de cuentas (is_active) aplicado en RLS. Se corre la migracion
      # de verdad contra un Postgres de verdad: la de la guardia, ademas, se
      # aplica SIN transaccion a proposito, porque asi fue como se descubrio que
      # el seguro no era atomico.
      - name: Verify is_active is enforced by the RLS helpers
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS rls_ok;" -c "CREATE DATABASE rls_ok;"
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS rls_guardia;" -c "CREATE DATABASE rls_guardia;"
          cd scripts
          psql -h localhost -U postgres -d rls_ok -v ON_ERROR_STOP=1 -f test-is-active-rls.sql
          psql -h localhost -U postgres -d rls_guardia -v ON_ERROR_STOP=1 -f test-is-active-rls-guardia.sql

      # La tercera pieza del bloqueo: revocar la sesion que el usuario ya
      # tenia. Tambien contra un Postgres de verdad, porque lo que se prueba
      # son las CASCADE del esquema auth —que la migracion no nombra— y que un
      # fallo revocando NO tumbe el bloqueo, que es el control primario.
      - name: Verify blocking a user revokes their sessions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS revocacion;" -c "CREATE DATABASE revocacion;"
          cd scripts
          psql -h localhost -U postgres -d revocacion -v ON_ERROR_STOP=1 -f test-revocar-sesion.sql

      # La conciliacion contable diaria mira 7 dias, no uno: sin traslape,
      # cualquier noche que el job falle pierde ese dia para siempre. La prueba
      # levanta un pg_cron de mentiras porque la extension no esta en CI, y lo
      # que se comprueba es la logica de la migracion, no pg_cron.
      - name: Verify the accounting reconciliation window self-heals
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS ventana;" -c "CREATE DATABASE ventana;"
          cd scripts
          psql -h localhost -U postgres -d ventana -v ON_ERROR_STOP=1 -f test-ventana-conciliacion.sql

      # `calculate_payment_breakdown` existia por duplicado: la de 2025 con 10%
      # y 3% clavados, y la de mayo-2026 que lee platform_settings. La segunda
      # no reemplazo a la primera —agregar parametros crea una funcion nueva—,
      # y como los parametros nuevos tienen DEFAULT, toda llamada de 3
      # argumentos moria con "is not unique". La prueba PROVOCA ese 42725 antes
      # de aplicar la migracion, y luego comprueba que la que sobrevive sigue a
      # la configuracion.
      - name: Verify only the config-driven payment breakdown survives
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS desglose;" -c "CREATE DATABASE desglose;"
          cd scripts
          psql -h localhost -U postgres -d desglose -v ON_ERROR_STOP=1 -f test-calculate-payment-breakdown.sql

      # La vista que alimenta el reporte maestro. Existe para cerrar dos
      # trampas y la prueba REPRODUCE LAS DOS antes de comprobar que las evita:
      # contar dos veces el dinero que pasa por el monedero, y contar el
      # ingreso de reservas canceladas (`voided` marca la fila pero no toca el
      # importe, y en produccion 4 de 8 canceladas ni siquiera estaban
      # anuladas). Tambien exige security_invoker: sin el, la vista seria un
      # rodeo alrededor de las RLS.
      - name: Verify the financial movements view keeps cash, liability and revenue apart
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS movimientos;" -c "CREATE DATABASE movimientos;"
          cd scripts
          psql -h localhost -U postgres -d movimientos -v ON_ERROR_STOP=1 -f test-vista-movimientos.sql

      # La captura de gastos es la unica parte del sistema contable donde el
      # importe lo escribe una persona, no un webhook. Tres riesgos: que el
      # asiento no cuadre cuando alguien edita el total en pesos (que es
      # editable a proposito, porque el banco aplica su propio tipo de cambio),
      # que el gasto se cargue a una cuenta que no es de gasto -- la llave
      # foranea acepta '102', Bancos -- y que lo registre quien no debe, porque
      # la funcion es SECURITY DEFINER y se salta las RLS por diseno.
      - name: Verify operating expense capture balances and checks authorization
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS gastos;" -c "CREATE DATABASE gastos;"
          cd scripts
          psql -h localhost -U postgres -d gastos -v ON_ERROR_STOP=1 -f test-gastos-operacion.sql

      # Paridad de la formula de IVA entre la canonica en TypeScript y su
      # traduccion a mano en plpgsql. compute_tax_snapshot corre en el trigger
      # que escribe el snapshot fiscal de cada cobro, y esos numeros son los que
      # van al CFDI: si las copias se separan, se declara un desglose y se guarda
      # otro. El .sql existia desde el 01-sep y no lo corria nadie.
      - name: Verify the VAT formula matches between TypeScript and plpgsql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tax_parity
        run: |
          PGDATABASE=postgres psql -c "DROP DATABASE IF EXISTS tax_parity;" -c "CREATE DATABASE tax_parity;"
          node scripts/test-tax-snapshot-sql.mjs

      # Misma categoria que el paso de arriba: una regla escrita dos veces. El
      # enmascarado de IP vive en `public.enmascarar_ip` —de donde
      # `insert_audit_log` deriva el `ip_masked` de la bitacora— y en
      # `_shared/contextoAuditoria.ts`, que hace falta igual porque
      # `user_sessions.ip_masked` no pasa por esa funcion. Sin Postgres la
      # prueba solo comprueba que la migracion afirme los mismos vectores; con
      # Postgres extrae la funcion, la crea y compara EJECUTANDO las dos.
      - name: Verify the IP-masking rule matches between TypeScript and SQL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: contexto_auditoria
        run: |
          PGDATABASE=postgres psql -c "DROP DATABASE IF EXISTS contexto_auditoria;" -c "CREATE DATABASE contexto_auditoria;"
          node scripts/test-contexto-auditoria.mjs

      # F-1 de la auditoria de frontend. Desde el 09-sep-2026 la linea base es
      # CERO: dejo de ser un contador y es una guardia. Cualquier consulta nueva
      # que ignore su error rompe este check.
      # Va aqui dentro y no en un job aparte a proposito: `lint` ya es check
      # requerido y corre en todos los PR, asi que no se agrega un check nuevo
      # que pueda quedarse en "Waiting for status to be reported".
      - name: Consultas a Supabase sin manejo de error (no debe subir)
        run: node scripts/check-supabase-errors.mjs

      # M-5 de la auditoria de Edge Functions. Guardia en cero, no contador:
      # nace en 0 hallazgos sobre las 171 funciones, asi que puede bloquear.
      # Va aqui por lo mismo que el paso de arriba: `lint` ya es requerido.
      - name: Nadie lee Origin/Referer crudo en Edge Functions
        run: node scripts/check-origin-header.mjs

      # Req. 10.2 de PCI DSS v4. Toda funcion que escriba en una tabla con
      # trigger de auditoria tiene que reenviar el origen del cliente; si no, la
      # bitacora registra la IP de la Edge Function en vez de la de la persona —
      # un dato que parece bueno y no lo es, que es peor que no tener ninguno.
      # Nace en 0 sobre 49 funciones en alcance. Y no es hipotetica: al
      # enganchar esas 49 se quedo fuera `stripe-webhook` por transcribir una
      # lista desde una salida truncada, y lo caso este escaner.
      # Disputas y contracargos de los CINCO procesadores. Hasta el 10-sep-2026
      # solo Stripe las registraba; PayPal tenia un case cuyo cuerpo entero era un
      # console.warn, que parece cobertura y no persiste nada. Esta guardia impide
      # volver ahi y ejercita registrarDisputa en sus seis escenarios.
      # La comision del procesador es el costo de cada cobro. Los caminos que la
      # insertan en 0 tienen que actualizarla despues; un 0 silencioso no se
      # distingue de "sin comision" e infla el margen que reporta el ERP.
      # Linea base de 17 sitios en 5 funciones (mismo criterio que tipos-edge):
      # se congela lo que hay y se bloquea lo nuevo.
      - name: Ningun cobro nuevo deja la comision en cero
        run: node scripts/test-comision-procesador.mjs

      - name: Los cinco procesadores registran sus disputas
        run: node scripts/test-disputas.mjs

      - name: Toda funcion que escribe bitacora reenvia el origen
        run: node scripts/check-audit-context.mjs

      # Tercer punto de las recomendaciones estructurales de la auditoria de Edge
      # Functions, el unico que quedaba. Los otros dos (_shared/auth.ts y
      # _shared/cors.ts) bajan el costo de ponerse el guard; solo este impide que
      # la funcion 172 nazca sin el. Linea base con motivo escrito por entrada:
      # ver scripts/edge-guards-linea-base.json.
      - name: Ninguna Edge Function nueva sin guard de autorizacion
        run: node scripts/check-edge-guards.mjs

      - name: Run ESLint (el veredicto lo da el paso siguiente)
        run: |
          # bash corre con -e: sin set +e, eslint saliendo != 0 aborta el step.
          # Aqui NO se juzga: el codigo de salida de eslint solo dice "hubo
          # problemas", no si son nuevos. Quien decide es summarize-lint --strict.
          set +e
          npx eslint . -f json -o eslint-report.json > eslint-stderr.log 2>&1
          CODE=$?
          set -e
          echo "eslint exit code: ${CODE}"

          # Si eslint revienta antes de escribir el reporte (config rota, OOM,
          # un plugin que no carga) el resumen no debe inventar un cero limpio:
          # se marca y el step de resumen lo dice en voz alta.
          if [ ! -s eslint-report.json ]; then
            echo "ESLINT_BROKEN=1" >> "$GITHUB_ENV"
            echo "::warning::ESLint no produjo reporte JSON"
            cat eslint-stderr.log
          fi
          exit 0

      - name: Summarize by rule (y bloquear si subio)
        run: |
          if [ "${ESLINT_BROKEN:-0}" = "1" ]; then
            {
              echo "## Lint"
              echo ""
              echo "> :rotating_light: ESLint no produjo reporte JSON."
              echo "> El conteo de este run no es comparable con la base."
              echo ""
              echo '```'
              tail -40 eslint-stderr.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Antes esto salia con 0: si eslint reventaba, el check pasaba verde.
            # Mismo falso verde que se corrigio en check-edge-types.mjs.
            # "No se pudo medir" no es "no hay errores nuevos".
            echo "::error::ESLint no produjo reporte: no se puede concluir nada"
            exit 1
          fi
          node scripts/summarize-lint.mjs --strict

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toursred-lint
          path: |
            eslint-report.json
            eslint-report.txt
            eslint-stderr.log
          retention-days: 30
          if-no-files-found: warn
