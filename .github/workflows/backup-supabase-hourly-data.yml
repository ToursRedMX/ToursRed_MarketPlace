name: Backup Supabase Hourly Data to Backblaze B2

on:
  workflow_dispatch:

  schedule:
    - cron: "10 * * * *"

jobs:
  hourly-data-backup:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. TOOLS
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify tools
        run: |
          supabase --version
          /usr/lib/postgresql/17/bin/psql --version
          aws --version

      # ============================================================
      # 2. TIMESTAMP
      # ============================================================

      - name: Generate backup timestamp
        run: |
          echo "BACKUP_DATE=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create backup directory
        run: |
          mkdir -p hourly-data-backup

      # ============================================================
      # 3. BACKUP APPLICATION SCHEMAS
      # ============================================================

      - name: Backup application schemas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f hourly-data-backup/schema.sql \
            --schema public,corporate

      # ============================================================
      # 4. BACKUP DATABASE DATA
      # ============================================================

      - name: Backup database data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f hourly-data-backup/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes" \
            -x "supabase_functions.migrations" \
            -x "supabase_functions.hooks" \
            -x "supabase_migrations.schema_migrations" \
            -x "supabase_migrations.seed_files" \
            -x "realtime.schema_migrations" \
            -x "realtime.subscription" \
            -x "realtime.messages" \
            -x "realtime.messages_2026_08_08" \
            -x "realtime.messages_2026_08_09" \
            -x "realtime.messages_2026_08_10" \
            -x "realtime.messages_2026_08_11" \
            -x "realtime.messages_2026_08_12" \
            -x "realtime.messages_2026_08_13" \
            -x "realtime.messages_2026_08_14" \
            -x "vault.secrets"

      # ============================================================
      # 5. SANITIZE DATA
      # ============================================================

      - name: Remove internal Supabase references
        run: |
          sed -i '/supabase_functions/d' hourly-data-backup/data.sql
          sed -i '/supabase_migrations/d' hourly-data-backup/data.sql
          sed -i '/"realtime"\./d' hourly-data-backup/data.sql
          sed -i '/"vault"\./d' hourly-data-backup/data.sql

      # ============================================================
      # 6. EXPORT APPLICATION SCHEMA INVENTORY
      # ============================================================

      - name: Export application schema inventory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$SUPABASE_DB_URL" \
            --no-align \
            --field-separator=$'\t' \
            --tuples-only \
            --command "
              SELECT
                table_schema,
                table_name,
                column_name,
                data_type,
                COALESCE(udt_name, ''),
                is_nullable,
                COALESCE(column_default, '')
              FROM information_schema.columns
              WHERE table_schema IN ('public', 'corporate')
                AND NOT (
                  table_schema = 'public'
                  AND table_name = 'wrappers_fdw_stats'
                )
              ORDER BY
                table_schema,
                table_name,
                column_name;
            " \
            > hourly-data-backup/schema_inventory.tsv

      # ============================================================
      # 7. VERIFY BACKUP
      # ============================================================

      - name: Verify backup files
        run: |
          test -s hourly-data-backup/schema.sql
          test -s hourly-data-backup/data.sql
          test -s hourly-data-backup/schema_inventory.tsv

          if grep -E 'supabase_functions|supabase_migrations|"realtime"\.|"vault"\.' hourly-data-backup/data.sql; then
            echo "ERROR: Internal Supabase references still exist in data.sql"
            exit 1
          fi

          echo ""
          echo "Hourly snapshot generated:"
          ls -lh hourly-data-backup/

      # ============================================================
      # 8. CHECKSUMS
      # ============================================================

      - name: Generate SHA256 checksums
        run: |
          cd hourly-data-backup

          sha256sum schema.sql > schema.sql.sha256
          sha256sum data.sql > data.sql.sha256
          sha256sum schema_inventory.tsv > schema_inventory.tsv.sha256

          echo ""
          echo "Checksums:"
          cat schema.sql.sha256
          cat data.sql.sha256
          cat schema_inventory.tsv.sha256

      # ============================================================
      # 9. UPLOAD TO BACKBLAZE
      # ============================================================

      - name: Upload hourly snapshot to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          for FILE in \
            schema.sql \
            schema.sql.sha256 \
            data.sql \
            data.sql.sha256 \
            schema_inventory.tsv \
            schema_inventory.tsv.sha256
          do
            aws s3 cp \
              "hourly-data-backup/${FILE}" \
              "s3://${B2_BUCKET}/hourly-data/${BACKUP_DATE}/${FILE}" \
              --endpoint-url "$B2_ENDPOINT" \
              --region "$AWS_DEFAULT_REGION"
          done

      # ============================================================
      # 10. VERIFY REMOTE BACKUP
      # ============================================================

      - name: Verify hourly snapshot in Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          REMOTE_FILES=$(
            aws s3 ls \
              "s3://${B2_BUCKET}/hourly-data/${BACKUP_DATE}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --region "$AWS_DEFAULT_REGION" \
            | wc -l
          )

          aws s3 ls \
            "s3://${B2_BUCKET}/hourly-data/${BACKUP_DATE}/" \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

          echo ""
          echo "Remote files: ${REMOTE_FILES}"

          if [ "$REMOTE_FILES" -ne 6 ]; then
            echo "ERROR: Expected 6 files in hourly snapshot."
            exit 1
          fi

      # ============================================================
      # 11. SUMMARY
      # ============================================================

      - name: DRP hourly backup summary
        run: |
          echo "============================================"
          echo "TOURSRED HOURLY SNAPSHOT"
          echo "============================================"
          echo ""
          echo "Public schema              BACKED UP"
          echo "Corporate schema           BACKED UP"
          echo "Database data              BACKED UP"
          echo "Schema inventory           BACKED UP"
          echo "SHA256 checksums           GENERATED"
          echo "Remote files               6 / 6"
          echo "Backup frequency           HOURLY"
          echo "Target data RPO            <= 1 HOUR"
          echo ""
          echo "PASS"

      # ============================================================
      # 12. CLEANUP
      # ============================================================

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf hourly-data-backup
