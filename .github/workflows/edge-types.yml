name: Tipos de Edge Functions

# `npm run typecheck` corre `tsc -p tsconfig.app.json` y ese tsconfig tiene
# "include": ["src"]. Las ~173 funciones de supabase/functions/ NO las
# type-checkea nada, ni en local ni en CI. Lo detectamos el 01-sep-2026 a raiz
# de generate-booking-cfdi: un `booking as {...}` escondia que el .select() no
# pedia tax_treatment, asi que el codigo leia una columna que la consulta nunca
# traia, y ni tsc ni el runtime decian nada.
#
# El runtime es Deno y no comparte tsconfig con el front, por eso es un check
# aparte con `deno check` en vez de ampliar el tsconfig del front.
#
# Hay 380 errores preexistentes. Exigir cero seria pedir semanas de limpieza
# antes de tener cualquier red, asi que la comparacion es contra una linea base
# commiteada: los viejos se toleran, uno NUEVO falla. Ver
# scripts/check-edge-types.mjs para por que la firma no lleva numero de linea.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tipos-edge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache de dependencias de Deno
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-edge-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-edge-${{ runner.os }}-

      - name: Type-check contra la linea base
        run: node scripts/check-edge-types.mjs | tee reporte-tipos-edge.txt

      # Las subrutas van aparte porque NINGUN type-check las ve: el paso de
      # arriba sale con 0 sobre un `npm:pdfmake@0.2.20/js/printer.js` que no
      # existe, y la guardia de dependencias tambien, porque la version SI es
      # exacta y unica. El unico que lo nota es el runtime, al arrancar la
      # funcion — o sea en produccion, despues de que el CLI diga "Deployed
      # Functions". Paso el 11-sep-2026 con `generate-signed-contract`.
      - name: La guardia de subrutas sigue detectando lo que dice detectar
        run: node scripts/test-guardia-subrutas.mjs

      - name: Toda subruta importada existe dentro de su paquete
        run: node scripts/check-edge-subpaths.mjs
        shell: bash

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Tipos de Edge Functions"
            echo ""
            if [ -f reporte-tipos-edge.txt ]; then
              echo '```'
              tail -60 reporte-tipos-edge.txt
              echo '```'
            else
              echo "No se genero reporte: el chequeo no llego a correr."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
