name: Typecheck

# Vite no ejecuta tsc, y `tsc -p tsconfig.json` devuelve 0 siempre porque ese
# archivo es solo referencias ("files": []). El unico invocador util es
# tsconfig.app.json.
#
# DEJO DE SER INFORMATIVO EL 11-sep-2026
#
# Hasta entonces el job reportaba y nunca bloqueaba: comparaba el TOTAL de
# errores contra `BASELINE_TOTAL` y escribia un aviso en el resumen. Un total no
# sirve para esto, y se vio de las dos formas posibles:
#
#   1. No ve las sustituciones. Se arreglan cinco errores y entran cinco: el
#      total no se mueve y los nuevos pasan sin que nada avise.
#   2. Se desactualiza en silencio. Ese dia la base decia 460 y el repo estaba
#      en 428 — 32 de holgura, o sea 32 errores nuevos admitidos sin chistar.
#      Nadie lo noto porque bajar errores no obliga a tocar el numero.
#
# Ahora `scripts/check-front-types.mjs` compara por FIRMA (archivo + codigo +
# mensaje, sin numero de linea) contra `scripts/front-check/baseline.txt`, y
# falla solo ante firmas NUEVAS. Bajar errores sigue sin costar nada; subirlos
# pone el check en rojo.
#
# La base NO nace en cero, y esta bien: arranca en 174 errores. Exigir cero
# pedia semanas de limpieza antes de tener ninguna red. Para bajarla:
# `node scripts/check-front-types.mjs --update`.
#
# El resumen por clases se conserva: sirve para ver la tendencia, aunque ya no
# sea lo que decide.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Estos dos ya NO deciden nada: quien bloquea es la comparacion por firma de
  # `scripts/check-front-types.mjs`. Se conservan porque el resumen los usa como
  # referencia historica de por donde iba la deuda.
  #
  # Linea base sobre main.
  # 26-ago-2026: 501/32 al medir -> 461/0 tras cerrar el paso 2.
  # 27-ago-2026: medido 460/0 sobre main. La base decia 461, uno de mas, asi
  # que un error nuevo podia colarse sin disparar el aviso (dispara con >).
  # 460 vale con TS 5.9.3 y con 6.0.3: el bump de la pieza I.3 no mueve el total.
  # Con la base de crash en 0 este contador es un centinela real: cualquier
  # TS2304/18047/18048 nuevo se nota contra cero, no contra "ya habia 32".
  BASELINE_TOTAL: 460
  BASELINE_CRASH: 0

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Antes de creerle a la guardia, comprobar que la guardia mira. Incluye el
      # caso que el contador anterior no podia ver: un error resuelto y otro
      # nuevo, con el total identico.
      - name: La guardia de tipos sigue detectando lo que dice detectar
        run: node scripts/test-guardia-tipos-front.mjs

      - name: Sin errores de tipos NUEVOS en el front
        run: node scripts/check-front-types.mjs

      - name: Run tsc otra vez para el resumen por clases (no bloquea)
        run: |
          # bash corre con -e: sin set +e, tsc saliendo != 0 aborta el step
          # y el check saldria rojo, que es justo lo que no queremos.
          set +e
          npx tsc --noEmit -p tsconfig.app.json > typecheck.log 2>&1
          CODE=$?
          set -e
          echo "tsc exit code: ${CODE}"
          exit 0

      - name: Summarize by error class
        run: |
          # Solo cuentan las lineas de error reales: tsc parte los mensajes
          # largos en lineas de continuacion indentadas que tambien traen "(".
          TOTAL=$(grep -cE 'error TS[0-9]+:' typecheck.log || true)
          FILES=$(grep -E '^[^ ].*\([0-9]+,[0-9]+\): error TS' typecheck.log \
            | sed -E 's/\([0-9]+,[0-9]+\): error TS.*//' \
            | sort -u | wc -l | tr -d ' ')
          UNUSED=$(grep -cE 'error TS(6133|6196|6192):' typecheck.log || true)
          CRASH=$(grep -cE 'error TS(2304|18047|18048):' typecheck.log || true)
          NOTDEF=$(grep -cE 'error TS2304:' typecheck.log || true)
          PROP=$(grep -cE 'error TS2339:' typecheck.log || true)

          {
            echo "## Typecheck (informativo, no bloquea)"
            echo ""
            echo "\`tsc --noEmit -p tsconfig.app.json\`"
            echo ""
            echo "| Clase | Errores | Base 26-ago |"
            echo "|---|---|---|"
            echo "| **Total** | ${TOTAL} en ${FILES} archivos | ${BASELINE_TOTAL} |"
            echo "| Declarado y no usado (TS6133/6196/6192) | ${UNUSED} | 239 |"
            echo "| Propiedad inexistente (TS2339) | ${PROP} | 120 |"
            echo "| **Posible crash (TS2304/18047/18048)** | **${CRASH}** | ${BASELINE_CRASH} |"
            echo "| Identificador inexistente (TS2304) | ${NOTDEF} | 0 |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${TOTAL}" -gt "${BASELINE_TOTAL}" ]; then
            echo "> :warning: Subio ${TOTAL} vs base ${BASELINE_TOTAL}." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${CRASH}" -gt "${BASELINE_CRASH}" ]; then
            echo "> :rotating_light: Clase crash subio a ${CRASH} (base ${BASELINE_CRASH})." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "=== TS2304 / TS18047 / TS18048 ==="
          grep -E 'error TS(2304|18047|18048):' typecheck.log || echo "(ninguno)"

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toursred-typecheck
          path: typecheck.log
          retention-days: 30
