name: Backup Supabase Logical to Backblaze B2

on:
  workflow_dispatch:

  schedule:
    - cron: "45 9 * * *"

jobs:
  logical-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify tools
        run: |
          supabase --version
          /usr/lib/postgresql/17/bin/psql --version
          aws --version

      - name: Generate backup timestamp
        run: |
          echo "BACKUP_DATE=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create backup directory
        run: |
          mkdir -p logical-backup

      - name: Backup database roles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f logical-backup/roles.sql \
            --role-only

      - name: Backup database schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f logical-backup/schema.sql

      - name: Backup database data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f logical-backup/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes" \
            -x "supabase_functions.migrations" \
            -x "supabase_functions.hooks" \
            -x "supabase_migrations.schema_migrations" \
            -x "supabase_migrations.seed_files" \
            -x "realtime.schema_migrations" \
            -x "realtime.subscription" \
            -x "realtime.messages" \
            -x "realtime.messages_2026_08_08" \
            -x "realtime.messages_2026_08_09" \
            -x "realtime.messages_2026_08_10" \
            -x "realtime.messages_2026_08_11" \
            -x "realtime.messages_2026_08_12" \
            -x "realtime.messages_2026_08_13" \
            -x "realtime.messages_2026_08_14" \
            -x "vault.secrets"

      - name: Remove internal Supabase references
        run: |
          sed -i '/supabase_functions/d' logical-backup/data.sql
          sed -i '/supabase_migrations/d' logical-backup/data.sql
          sed -i '/"realtime"\./d' logical-backup/data.sql
          sed -i '/"vault"\./d' logical-backup/data.sql

      - name: Backup migration history schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f logical-backup/history_schema.sql \
            --schema supabase_migrations

      - name: Backup migration history data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f logical-backup/history_data.sql \
            --use-copy \
            --data-only \
            --schema supabase_migrations

      - name: Export Cron inventory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql \
            "$SUPABASE_DB_URL" \
            --no-align \
            --field-separator=$'\t' \
            --tuples-only \
            --command "
              SELECT
                jobname,
                schedule,
                active,
                database,
                username,
                encode(convert_to(command, 'UTF8'), 'hex')
              FROM cron.job
              ORDER BY jobname;
            " \
            > logical-backup/cron_jobs.tsv

          CRON_COUNT=$(
            /usr/lib/postgresql/17/bin/psql \
              "$SUPABASE_DB_URL" \
              --no-align \
              --tuples-only \
              --command "
                SELECT COUNT(*)
                FROM cron.job;
              "
          )

          echo "Production Cron Jobs: ${CRON_COUNT}"

          # No se fija un numero: eso rompia el backup cada vez que se anadia un
          # cron job (paso de 15 a 17 el 14-ago y dejo 15 dias sin subir nada a
          # B2, porque este paso corre ANTES del upload). Lo que importa es que
          # el export este completo, no cuantos jobs haya.
          if [ "$CRON_COUNT" -eq 0 ]; then
            echo "ERROR: cron.job esta vacio en produccion. Algo va mal."
            exit 1
          fi

          FILE_COUNT=$(wc -l < logical-backup/cron_jobs.tsv)

          echo "Cron inventory rows: ${FILE_COUNT}"

          if [ "$FILE_COUNT" -ne "$CRON_COUNT" ]; then
            echo "ERROR: cron_jobs.tsv tiene ${FILE_COUNT} filas y cron.job tiene ${CRON_COUNT}."
            echo "El export quedo truncado."
            exit 1
          fi

      - name: Generate Cron restore SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cat > logical-backup/cron_jobs.sql <<'SQL'
          -- ToursRed Cron Jobs DRP restore
          --
          -- Generated automatically from production.
          -- Do not edit manually.
          --
          -- Assumes pg_cron is installed in the destination project.

          SQL

          /usr/lib/postgresql/17/bin/psql \
            "$SUPABASE_DB_URL" \
            --no-align \
            --tuples-only \
            --command "
              SELECT
                format(
                  'SELECT cron.schedule(%L, %L, %L);',
                  jobname,
                  schedule,
                  command
                )
              FROM cron.job
              ORDER BY jobname;
            " \
            >> logical-backup/cron_jobs.sql

          /usr/lib/postgresql/17/bin/psql \
            "$SUPABASE_DB_URL" \
            --no-align \
            --tuples-only \
            --command "
              SELECT
                format(
                  'SELECT cron.alter_job((SELECT jobid FROM cron.job WHERE jobname = %L), active := false);',
                  jobname
                )
              FROM cron.job
              WHERE active = false
              ORDER BY jobname;
            " \
            >> logical-backup/cron_jobs.sql

      - name: Verify backup files
        run: |
          test -s logical-backup/roles.sql
          test -s logical-backup/schema.sql
          test -s logical-backup/data.sql
          test -s logical-backup/history_schema.sql
          test -s logical-backup/history_data.sql
          test -s logical-backup/cron_jobs.sql
          test -s logical-backup/cron_jobs.tsv

          CRON_SQL_COUNT=$(
            grep -c "SELECT cron.schedule" logical-backup/cron_jobs.sql
          )

          CRON_TSV_COUNT=$(
            wc -l < logical-backup/cron_jobs.tsv
          )

          echo "Cron schedules in SQL: ${CRON_SQL_COUNT}"
          echo "Cron jobs in inventory: ${CRON_TSV_COUNT}"

          # Consistencia entre los dos artefactos, sin fijar un numero.
          if [ "$CRON_TSV_COUNT" -eq 0 ]; then
            echo "ERROR: cron_jobs.tsv esta vacio."
            exit 1
          fi

          if [ "$CRON_SQL_COUNT" -ne "$CRON_TSV_COUNT" ]; then
            echo "ERROR: cron_jobs.sql tiene ${CRON_SQL_COUNT} schedules y el inventario ${CRON_TSV_COUNT} jobs."
            echo "El SQL de restauracion no reconstruiria todos los cron jobs."
            exit 1
          fi

          echo ""
          echo "Logical backup generated:"
          ls -lh logical-backup/

      - name: Verify internal references are gone
        run: |
          if grep -E 'supabase_functions|supabase_migrations|"realtime"\.|"vault"\.' logical-backup/data.sql; then
            echo "ERROR: Internal Supabase references still exist in data.sql"
            exit 1
          fi

          echo "No unwanted internal Supabase references found in main data.sql."

      - name: Upload logical backup to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          for FILE in \
            roles.sql \
            schema.sql \
            data.sql \
            history_schema.sql \
            history_data.sql \
            cron_jobs.sql \
            cron_jobs.tsv
          do
            aws s3 cp \
              "logical-backup/${FILE}" \
              "s3://${B2_BUCKET}/logical/${BACKUP_DATE}/${FILE}" \
              --endpoint-url "$B2_ENDPOINT" \
              --region "$AWS_DEFAULT_REGION"
          done

      - name: Verify logical backup in Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          aws s3 ls \
            "s3://${B2_BUCKET}/logical/${BACKUP_DATE}/" \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

      - name: DRP backup summary
        run: |
          echo "============================================"
          echo "TOURSRED LOGICAL BACKUP"
          echo "============================================"
          echo ""
          echo "Database roles             BACKED UP"
          echo "Database schema            BACKED UP"
          echo "Database data              BACKED UP"
          echo "Migration history          BACKED UP"
          echo "Cron Jobs                  15 / 15"
          echo ""
          echo "Files in logical snapshot: 7"
          echo ""
          echo "PASS"

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf logical-backup

  # Un workflow programado que falla no le llega a nadie: este backup estuvo
  # roto en silencio y solo se descubrio por casualidad. Abre una incidencia.
  avisar-si-falla:
    needs: [logical-backup]
    if: failure()
    uses: ./.github/workflows/notify-backup-failure.yml
    permissions:
      issues: write
      contents: read
    with:
      workflow_name: 'Backup Supabase Logical to Backblaze B2'
