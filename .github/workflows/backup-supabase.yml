name: Backup Supabase to Backblaze B2

on:
  workflow_dispatch:

  schedule:
    - cron: "15 9 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify PostgreSQL version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Generate backup filename
        run: |
          echo "BACKUP_DATE=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="toursred-${BACKUP_DATE}.dump"

      - name: Verify backup file
        run: |
          /usr/lib/postgresql/17/bin/pg_restore \
            --list \
            "toursred-${BACKUP_DATE}.dump" \
            > backup_contents.txt

          echo "Backup file successfully generated:"
          ls -lh "toursred-${BACKUP_DATE}.dump"

      - name: Upload backup to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          aws s3 cp \
            "toursred-${BACKUP_DATE}.dump" \
            "s3://${B2_BUCKET}/database/toursred-${BACKUP_DATE}.dump" \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

      - name: Verify backup in Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          aws s3 ls \
            "s3://${B2_BUCKET}/database/toursred-${BACKUP_DATE}.dump" \
            --endpoint-url "$B2_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

      - name: Delete temporary backup
        if: always()
        run: |
          rm -f "toursred-${BACKUP_DATE}.dump"
          rm -f backup_contents.txt
